name: Rust library
on: [push, pull_request]
jobs:
  correctness:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --all-features --release
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add clippy rustfmt --toolchain stable
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked --no-default-features
